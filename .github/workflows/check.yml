name: Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          find extension scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate source manifests
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const chrome = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          const firefox = JSON.parse(fs.readFileSync('extension/manifest.firefox.json', 'utf8'));
          if (chrome.version !== firefox.version) throw new Error('Browser manifest versions differ');
          if (!chrome.background?.service_worker) throw new Error('Chromium service worker missing');
          if (!firefox.background?.scripts?.length) throw new Error('Firefox background scripts missing');
          if ('key' in firefox) throw new Error('Firefox manifest must not contain Chrome key');
          if (!firefox.browser_specific_settings?.gecko?.id) throw new Error('Firefox Gecko ID missing');
          if (chrome.permissions?.includes('nativeMessaging')) throw new Error('nativeMessaging must not be required');
          if (chrome.permissions?.includes('identity')) throw new Error('Identity permission is no longer needed');
          const requiredHosts = [
            'https://api.openai.com/*',
            'https://api.anthropic.com/*',
            'https://generativelanguage.googleapis.com/*',
            'https://openrouter.ai/*',
            'https://api.mistral.ai/*',
            'https://api.groq.com/*',
          ];
          for (const host of requiredHosts) {
            if (!chrome.host_permissions?.includes(host)) throw new Error(`Missing Chromium API host: ${host}`);
            if (!firefox.host_permissions?.includes(host)) throw new Error(`Missing Firefox API host: ${host}`);
          }
          NODE
      - name: Build Chromium and Firefox packages
        run: node scripts/build-extension.mjs
      - name: Validate built manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('dist/chromium/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('dist/firefox/manifest.json','utf8'));"
