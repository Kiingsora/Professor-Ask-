name: Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          find extension native-host -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
      - name: Smoke test Native Messaging protocol
        run: node native-host/test-native-host.mjs

  native-host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile and register optional Antigravity companion
        shell: powershell
        run: |
          & .\native-host\install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native host installer failed' }

          $registryPath = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.professorask.bridge'
          if (-not (Test-Path $registryPath)) { throw 'Native host registry entry missing' }

          $manifestPath = (Get-Item $registryPath).GetValue('')
          if (-not $manifestPath) { throw 'Native host manifest registry value missing' }
          if (-not (Test-Path $manifestPath)) { throw "Native host manifest missing: $manifestPath" }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'com.professorask.bridge') { throw 'Unexpected native host name' }
          if ($manifest.allowed_origins[0] -ne 'chrome-extension://geibmmecfgilkhncpcjjldbidnejflfb/') { throw 'Unexpected extension origin' }
          if (-not (Test-Path $manifest.path)) { throw "Native host executable missing: $($manifest.path)" }

          $installRoot = Join-Path $env:LOCALAPPDATA 'ProfessorAsk\NativeHost\0.7.0'
          if (-not ($manifest.path.StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase))) {
            throw "Native host was not installed under LocalAppData: $($manifest.path)"
          }
